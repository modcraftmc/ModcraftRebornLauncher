name: Automatic Build
on:
    push:
        branches:
        - main
        - dev
jobs:
    build:
        runs-on: ['manu-homelab']
        steps:
          - name: Checkout
            uses: actions/checkout@v4
          - name: Setup Java
            uses: actions/setup-java@v4.7.1
            with:
              distribution: 'temurin'
              java-version: '21'
          - name: Run chmod to make gradlew executable
            run: chmod +x ./gradlew
          - name: Setup Gradle
            uses: gradle/actions/setup-gradle@v4
          - name: Build with Gradle
            run: ./gradlew build
            env:
              BUILDPROD: ${{ github.ref_name == 'main' }}
          - name: Upload File to our api (prod)
            if: ${{ github.ref_name == 'main' }}
            id: upload-prod
            uses: modcraftmc/upload-artifact-action@1.7
            with:
             url: https://api.modcraftmc.fr/v1/updater/launcher
             bearerAuthorization: ${{ secrets.API_KEY }}
             fileForms: '{"launcher":"build/libs/launcher.jar"}'
          - name: Upload File to our api (DEV)
            if: ${{ github.ref_name == 'dev' }}
            id: upload-dev
            uses: modcraftmc/upload-artifact-action@1.7
            with:
              url: https://api.dev.modcraftmc.fr/v1/updater/launcher
              bearerAuthorization: ${{ secrets.DEV_API_KEY }}
              fileForms: '{"launcher":"build/libs/launcher.jar"}'
